name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: check
        run: |
          go vet ./...
          go test -count=1 ./...
      - name: build
        env:
          VERSION: ${{ github.ref_name }}
        run: scripts/dist.sh "$VERSION"
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: gh release create "$VERSION" dist/*.tar.gz dist/checksums.txt --title "$VERSION" --generate-notes --verify-tag
